name: Claude PR Fix

on:
  issue_comment:
    types: [created]

# The fix job pushes to the PR branch, so it needs contents: write. The OIDC token is
# how the action authenticates to Anthropic (this repo holds no API-key secret).
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # A job's `if` cannot read secrets, so this one reads them and says whether the
  # action has anything to sign in with; without a credential the fix job would
  # only ever fail at the comment that asked for it.
  credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only when someone who can already push comments "@claude fix" on a PR: the fix job
    # runs an agent with repository write access, so a drive-by comment must not start it.
    # The check sits here, not on the fix job, because every other comment on an issue or a
    # PR fires this workflow too, and a job that starts is a billed minute; a skipped one is
    # free, and skips the fix job with it.
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude fix') &&
      github.event.comment.user.login != 'claude[bot]' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    outputs:
      configured: ${{ steps.probe.outputs.configured }}
    steps:
      - id: probe
        env:
          CONFIGURED: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"
          [ "$CONFIGURED" = "true" ] ||
            echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN; skipping the Claude fix."

  fix:
    needs: credentials
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Who may start this, and with what comment, is decided on the credentials job above.
    if: needs.credentials.outputs.configured == 'true'
    steps:
      # Pinned to a commit: a tag can be moved, and this action runs with write access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        with:
          # Whichever of the two the repository has; the job does not start without one.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are fixing issues on a pull request for a Kotlin project (Ktor proxy
            plus a Compose for Desktop app).

            Steps:
            1. Read the full PR diff against main.
            2. Read all review comments and feedback on this PR.
            3. Identify high-value fixes that are within the PR's scope.
            4. Apply only targeted, minimal fixes.
            5. Do NOT refactor unrelated code or broaden the PR scope.
            6. Do NOT add features beyond what the PR intended.
            7. Preserve architecture and module boundaries.
            8. Run ./gradlew ktfmtFormat and then ./gradlew build as separate commands.
            9. Commit fixes with clear messages describing what was fixed and why.
            10. Push fixes to the PR branch.

            Constraints:
            - Only fix issues relevant to this PR
            - Prefer root-cause fixes over workarounds
            - Do not weaken security or trust boundaries
            - Never change the gates (detekt, ktfmt, compiler flags, Kover, ArchUnit,
              hooks, workflows) and never add @Suppress or a baseline entry
            - Keep changes minimal and traceable
            - If a fix would significantly expand scope, leave a comment instead
          # Tool limits belong here, in the CLI's own --allowedTools: the action's
          # additional_permissions input is for GitHub scopes ("actions: read") and
          # refuses a tool pattern. These are the commands this job actually needs.
          claude_args: >-
            --model claude-sonnet-4-6 --max-turns 10
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(./gradlew:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git fetch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
