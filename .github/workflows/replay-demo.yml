name: Replay demo

# Replays a committed cassette with no API key: no secrets, and an upstream nothing listens on.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :proxy:installDist
      - run: bash examples/ci-replay/replay.sh
