name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every other workflow here says what it needs; this one never did, and it is now the one that
# uploads an artifact. The repository default is already read-only, so this takes nothing away
# and changes no step — it writes the assumption down where a default cannot quietly change it.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
        shell: bash
      # `build` proves a zip was written; this proves it starts. Nothing else in the gate runs the
      # jar the installers carry, so a lost main class, a dropped service file or a manifest
      # without a version would reach a user before it reached a check. On both legs, because it
      # costs seconds and a jar packed on Windows is the one Windows users would get.
      # The version is the untagged fallback from the root build script: change it there and here.
      - run: bash examples/jar-boot/boot.sh 1.0.0-dev
        shell: bash
      # The jar the app starts and a release ships, kept from every run. `build` has already made
      # it, because the proxy's `assemble` depends on `fatJar`; one leg uploads it because the file
      # is the same whichever OS built it, and two legs cannot share an artifact name.
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: peashoot-jar
          path: proxy/build/libs/peashoot.jar
          retention-days: 14
          if-no-files-found: error
  # The Godot farm's GDScript, gated the way ktfmt and detekt gate the Kotlin (ADR 0003): layout by
  # gdformat, and gdlint's default rules. The studies under farm/studies are comparisons, not the
  # farm, and are not gated. One leg: the tools and the scripts do not care which OS reads them.
  farm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --user -r farm/requirements-lint.txt
      - run: gdformat --check farm/*.gd
      - run: gdlint farm/*.gd
